<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — MRD Group</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e9e7e2">
<link rel="icon" href="/mrd-group/img/favicon.svg" type="image/svg+xml">

<!--
  This page is deliberately self-contained.

  GitHub Pages serves 404.html for ANY missing path, including nested ones
  such as /mrd-group/a/b/c. A relative "./css/site.css" would resolve against
  that nested path and fail, so the styles are inlined and the few links use
  the repository-root path. This is the ONLY file in the project allowed to
  use absolute paths — if the repository is ever renamed, update them here.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    display: grid;
    align-content: center;
    gap: 1.5rem;
    padding: 2rem clamp(1.25rem, 8vw, 6rem);
    background: #e9e7e2;
    color: #12120f;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    line-height: 1.7;
  }
  .rules { display: grid; gap: 5px; margin-bottom: 1rem; }
  .rules i { display: block; height: 2px; background: #8a5f2b; }
  .rules i:nth-child(1) { width: 2.5rem; }
  .rules i:nth-child(2) { width: 4.5rem; }
  .rules i:nth-child(3) { width: 7rem; }
  .code {
    font-family: "Newsreader", "Times New Roman", Georgia, serif;
    font-size: clamp(3.5rem, 14vw, 7rem);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  h1 {
    font-family: "Newsreader", "Times New Roman", Georgia, serif;
    font-size: clamp(1.35rem, 4vw, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  p { color: #55544c; max-width: 34rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
  a {
    display: inline-block;
    padding: 1rem 1.75rem;
    font-size: 0.875rem;
    text-decoration: none;
    border: 1px solid #12120f;
    background: #12120f;
    color: #e9e7e2;
    transition: background-color .5s cubic-bezier(.16,1,.3,1), color .5s cubic-bezier(.16,1,.3,1);
  }
  a:hover { background: transparent; color: #12120f; }
  a.ghost { background: transparent; color: #12120f; border-color: rgba(18,18,15,.14); }
  a.ghost:hover { background: #12120f; color: #e9e7e2; border-color: #12120f; }
  a:focus-visible { outline: 2px solid #8a5f2b; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="rules" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="code">404</p>
  <h1>Aradığınız sayfa bulunamadı</h1>
  <p>Bağlantı taşınmış veya kaldırılmış olabilir. Ana sayfadan devam edebilirsiniz.</p>
  <div class="actions">
    <a href="/mrd-group/">Ana sayfa</a>
    <a class="ghost" href="/mrd-group/iletisim.html">İletişim</a>
  </div>
</body>
</html>
