<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Gaziantep konum haritası — şematik">
  <defs>
    <clipPath id="mapclip"><rect x="0" y="0" width="800" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#mapclip)">
    <rect width="800" height="600" fill="#e4e1da"/>

    <!-- city blocks: faint fill so the road network reads on top -->
    <g fill="#12120f" fill-opacity="0.028">
      <rect x="60" y="70" width="120" height="90"/>
      <rect x="210" y="60" width="150" height="70"/>
      <rect x="470" y="90" width="140" height="100"/>
      <rect x="640" y="70" width="120" height="120"/>
      <rect x="70" y="360" width="140" height="110"/>
      <rect x="250" y="410" width="120" height="120"/>
      <rect x="520" y="380" width="150" height="100"/>
      <rect x="600" y="470" width="150" height="110"/>
      <rect x="120" y="200" width="90" height="80"/>
    </g>

    <!-- river / green corridor -->
    <path d="M-20 210 C 160 180 240 300 380 280 S 640 340 820 300" fill="none"
          stroke="#2e6244" stroke-opacity="0.30" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 210 C 160 180 240 300 380 280 S 640 340 820 300" fill="none"
          stroke="#2e6244" stroke-opacity="0.16" stroke-width="22" stroke-linecap="round"/>

    <!-- ring roads (concentric arcs around the centre) -->
    <g fill="none" stroke="#12120f" stroke-opacity="0.16">
      <circle cx="410" cy="315" r="235" stroke-width="2.5"/>
      <circle cx="410" cy="315" r="150" stroke-width="2"/>
      <circle cx="410" cy="315" r="78" stroke-width="1.6"/>
    </g>

    <!-- radial avenues -->
    <g stroke="#12120f" stroke-opacity="0.20" stroke-width="2">
      <path d="M410 315 L 410 -40"/>
      <path d="M410 315 L 840 120"/>
      <path d="M410 315 L 880 360"/>
      <path d="M410 315 L 700 640"/>
      <path d="M410 315 L 300 660"/>
      <path d="M410 315 L -60 470"/>
      <path d="M410 315 L -40 150"/>
    </g>

    <!-- secondary grid streets -->
    <g stroke="#12120f" stroke-opacity="0.07" stroke-width="1">
      <path d="M0 120 H800 M0 200 H800 M0 470 H800 M0 540 H800"/>
      <path d="M150 0 V600 M640 0 V600 M760 0 V600"/>
    </g>

    <!-- soft pin shadow -->
    <ellipse cx="410" cy="322" rx="26" ry="8" fill="#12120f" fill-opacity="0.16"/>
  </g>

  <!-- location pin (bronze) -->
  <g transform="translate(410 315)">
    <path d="M0 8 C -20 -14 -20 -40 0 -40 C 20 -40 20 -14 0 8 Z"
          fill="#8a5f2b"/>
    <circle cx="0" cy="-24" r="7" fill="#e4e1da"/>
  </g>
</svg>
